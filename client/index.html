<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jarvis English Coach</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f0f1e">
    <meta name="description" content="Tu profesor de inglés 24/7 con IA. Aprende 20 palabras diarias.">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=1, maximum-scale=5, user-scalable=yes">

    <!-- iOS App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jarvis English">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Splashscreen para iOS -->
    <link rel="apple-touch-startup-image" href="/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('✅ Service Worker registrado:', registration);
              
              // Check for updates periodically
              setInterval(() => {
                registration.update();
              }, 60000); // Cada minuto
            })
            .catch((error) => {
              console.error('❌ Service Worker error:', error);
            });
        });
      }

      // Detectar cuando hay nueva versión disponible
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('🔄 Nueva versión de app disponible');
          // Opcional: mostrar notificación al usuario
          if (confirm('Nueva versión disponible. ¿Recargar?')) {
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
